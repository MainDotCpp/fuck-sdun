<!DOCTYPE html>
<html>
<head>
    <title>测试 userAgentData</title>
</head>
<body>
    <h1>userAgentData 测试</h1>
    <div id="results"></div>
    <script>
        async function test() {
            const results = document.getElementById('results');
            const ua = navigator.userAgent;
            
            // 提取 Android 版本
            const androidMatch = ua.match(/\bAndroid\s+(\d+)(?:[._](\d+))?/i);
            const uaVersion = androidMatch ? androidMatch[1] : 'unknown';
            
            let html = '<h2>User-Agent 分析</h2>';
            html += '<p>User-Agent: ' + ua + '</p>';
            html += '<p>提取的 Android 版本: ' + uaVersion + '</p>';
            
            // 测试 userAgentData
            if (navigator.userAgentData) {
                html += '<h2>userAgentData</h2>';
                html += '<p>platform: ' + navigator.userAgentData.platform + '</p>';
                html += '<p>mobile: ' + navigator.userAgentData.mobile + '</p>';
                
                try {
                    const hints = await navigator.userAgentData.getHighEntropyValues(['platform', 'platformVersion', 'model', 'mobile']);
                    html += '<h2>getHighEntropyValues 结果</h2>';
                    html += '<p>platform: ' + hints.platform + '</p>';
                    html += '<p>platformVersion: ' + hints.platformVersion + '</p>';
                    html += '<p>model: ' + hints.model + '</p>';
                    html += '<p>mobile: ' + hints.mobile + '</p>';
                    
                    // 比较
                    html += '<h2>一致性检查</h2>';
                    if (hints.platformVersion === uaVersion) {
                        html += '<p style="color: green;">✅ platformVersion 与 User-Agent 一致</p>';
                    } else {
                        html += '<p style="color: red;">❌ platformVersion 与 User-Agent 不一致</p>';
                        html += '<p>User-Agent 版本: ' + uaVersion + '</p>';
                        html += '<p>platformVersion: ' + hints.platformVersion + '</p>';
                    }
                    
                    if (hints.platform === 'Android') {
                        html += '<p style="color: green;">✅ platform 是 Android</p>';
                    } else {
                        html += '<p style="color: red;">❌ platform 不是 Android: ' + hints.platform + '</p>';
                    }
                } catch (e) {
                    html += '<p style="color: red;">错误: ' + e.message + '</p>';
                }
            } else {
                html += '<p style="color: orange;">⚠️ userAgentData 不存在</p>';
            }
            
            results.innerHTML = html;
        }
        
        test();
    </script>
</body>
</html>
